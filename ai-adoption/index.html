<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SMB AI Adoption Guide • Nick Scarabosio</title>
  <meta name="description" content="Install AI without the mess. Phased adoption guide for SMBs — access, data, cost, rules." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070912;
      --panel: #0d1220;
      --line: rgba(163, 146, 255, 0.16);
      --line-strong: rgba(163, 146, 255, 0.35);
      --text: #f2f3ff;
      --body: #d8dcf0;
      --muted: #9ea6c5;
      --soft: #6d7591;
      --purple: #9d6cff;
      --purple-solid: #8b5cf6;
      --purple-soft: rgba(157, 108, 255, 0.14);
      --green: #7ef0b4;
      --green-soft: rgba(126, 240, 180, 0.12);
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Inter', system-ui, sans-serif;
      --danger: #ff8b8b;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at 50% 0%, rgba(157, 108, 255, 0.2), transparent 34%),
        radial-gradient(circle at 88% 12%, rgba(126, 240, 180, 0.06), transparent 22%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #c9b8ff; }
    .wrap {
      width: min(820px, calc(100% - 20px));
      margin: 16px auto 40px;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, rgba(17, 23, 39, 0.98), rgba(10, 13, 24, 0.98));
      box-shadow: var(--shadow);
    }
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.02);
      flex-wrap: wrap;
    }
    .lights { display: flex; gap: 7px; flex-shrink: 0; }
    .lights i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .lights i:nth-child(1) { background: #ff5f57; }
    .lights i:nth-child(2) { background: #febc2e; }
    .lights i:nth-child(3) { background: #28c840; }
    .title {
      font-family: var(--mono); font-size: 12px; color: var(--muted);
      display: flex; align-items: center; gap: 8px; margin-right: auto;
    }
    .badge {
      padding: 4px 9px; border-radius: 999px;
      border: 1px solid rgba(157,108,255,0.3); background: var(--purple-soft);
      color: #e4dbff; text-transform: uppercase; font-size: 10px; letter-spacing: .1em;
    }
    .nav { display: flex; gap: 4px; flex-wrap: wrap; }
    .nav a {
      font-family: var(--mono); font-size: 11px; color: var(--soft);
      text-decoration: none; padding: 8px 11px; border-radius: 999px;
      border: 1px solid transparent; min-height: 36px; display: inline-flex; align-items: center;
    }
    .nav a:hover, .nav a.active {
      color: var(--text); border-color: var(--line); background: rgba(255,255,255,0.04);
    }
    .progress-bar { height: 3px; background: rgba(255,255,255,0.05); }
    .progress-bar > span {
      display: block; height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--purple-solid), var(--green));
      transition: width .35s ease;
    }
    .step-meta {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 22px 0; font-family: var(--mono); font-size: 12px; color: var(--soft);
    }
    .step-meta strong { color: var(--green); font-weight: 500; }
    .step-rail {
      display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 22px 0;
    }
    .step-pill {
      appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.02);
      color: var(--soft); border-radius: 999px; padding: 8px 12px;
      font-family: var(--mono); font-size: 11px; cursor: pointer; min-height: 36px;
    }
    .step-pill:hover { color: var(--text); border-color: var(--line-strong); }
    .step-pill.active {
      color: #fff; border-color: rgba(139,92,246,0.55); background: var(--purple-solid);
    }
    .step-pill.done { color: var(--green); border-color: rgba(126,240,180,0.3); }
    .step-pill.locked { opacity: .4; cursor: not-allowed; }
    .content { padding: 28px 22px 36px; }
    .eyebrow {
      font-family: var(--mono); color: var(--green); text-transform: uppercase;
      letter-spacing: .14em; font-size: 11px; margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 14px; font-size: clamp(1.9rem, 4.5vw, 2.6rem);
      line-height: 1.05; letter-spacing: -0.035em;
    }
    h2 { margin: 0 0 8px; font-size: 1.2rem; letter-spacing: -0.02em; }
    .lede {
      margin: 0 0 20px; max-width: 36rem; color: var(--body);
      font-size: 1.08rem; line-height: 1.65;
    }
    p { color: var(--body); line-height: 1.65; margin: 0 0 12px; }
    .highlight { color: var(--text); font-weight: 500; }
    .punch {
      margin: 0 0 18px; color: var(--text); font-size: 1.12rem; line-height: 1.45; font-weight: 500;
    }
    .damage {
      list-style: none; margin: 0 0 24px; padding: 0;
      display: grid; gap: 8px;
    }
    .damage li {
      color: var(--body); padding: 10px 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.02);
      line-height: 1.45;
    }
    .damage li::before {
      content: "→ "; color: var(--green); font-family: var(--mono); font-size: 12px;
    }
    .meta {
      display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px;
      font-family: var(--mono); font-size: 12px; color: var(--soft);
    }
    .meta span {
      padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--line); background: rgba(255,255,255,0.02);
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .btn {
      appearance: none; border: 1px solid var(--line); background: transparent;
      color: var(--text); border-radius: 12px; padding: 13px 20px;
      font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.15s ease; min-height: 46px;
    }
    .btn:hover { border-color: var(--line-strong); background: rgba(157,108,255,0.1); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.primary {
      border-color: transparent; background: var(--purple-solid); color: #fff; font-weight: 600;
    }
    .btn.primary:hover { background: #9b6dff; filter: brightness(1.05); }
    .btn.ghost { color: var(--muted); }
    .card-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;
      margin: 8px 0 8px;
    }
    .fail-card, .info-card {
      border: 1px solid rgba(255,255,255,0.07); border-radius: 14px;
      background: rgba(255,255,255,0.025); padding: 14px;
      text-align: left; cursor: pointer; color: inherit; font: inherit;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .fail-card:hover, .info-card:hover {
      border-color: var(--line-strong); background: rgba(157,108,255,0.08); transform: translateY(-1px);
    }
    .fail-card strong, .info-card strong { display: block; color: var(--text); margin-bottom: 4px; font-size: .98rem; }
    .fail-card p, .info-card p { margin: 0; font-size: .88rem; color: var(--muted); line-height: 1.4; }
    .rule {
      border: 1px solid rgba(126,240,180,0.28); background: var(--green-soft);
      border-radius: 16px; padding: 16px 18px; margin: 0 0 22px;
    }
    .rule .k {
      font-family: var(--mono); font-size: 11px; color: var(--green);
      text-transform: uppercase; letter-spacing: .12em; margin-bottom: 8px;
    }
    .rule p { margin: 0; color: var(--text); font-weight: 600; font-size: 1.05rem; line-height: 1.4; }
    .checklist { display: grid; gap: 8px; margin: 0 0 8px; }
    .check-item {
      display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start;
      border: 1px solid rgba(255,255,255,0.07); border-radius: 12px;
      background: rgba(255,255,255,0.02); padding: 13px 14px;
      cursor: pointer; transition: border-color .15s ease;
    }
    .check-item:hover { border-color: var(--line-strong); }
    .check-item.checked { border-color: rgba(126,240,180,0.32); background: rgba(126,240,180,0.06); }
    .check-item input { margin-top: 3px; accent-color: var(--green); width: 16px; height: 16px; }
    .check-item span { color: var(--body); line-height: 1.5; font-size: .98rem; }
    .check-item.checked span { color: var(--text); }
    .section-label {
      margin: 28px 0 12px; font-family: var(--mono); font-size: 11px; color: var(--soft);
      text-transform: uppercase; letter-spacing: .12em;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .section-label .subtle { color: var(--muted); text-transform: none; letter-spacing: 0; font-size: 12px; }
    .context { margin: 0 0 20px; color: var(--muted); font-size: .98rem; max-width: 36rem; }
    .gate-box {
      border: 1px solid rgba(157,108,255,0.32); background: rgba(157,108,255,0.1);
      border-radius: 18px; padding: 22px; margin: 8px 0 12px;
    }
    .form-grid { display: grid; gap: 12px; margin-top: 14px; max-width: 400px; }
    label {
      display: grid; gap: 6px; font-family: var(--mono); font-size: 11px;
      color: var(--soft); text-transform: uppercase; letter-spacing: .08em;
    }
    input[type="text"], input[type="email"] {
      appearance: none; width: 100%; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(0,0,0,0.28); color: var(--text); padding: 12px 14px;
      font: inherit; font-size: 16px;
    }
    input:focus { outline: none; border-color: rgba(157,108,255,0.55); }
    .hp { position: absolute; left: -9999px; opacity: 0; height: 0; width: 0; overflow: hidden; }
    .form-note { font-size: .85rem; color: var(--soft); margin: 8px 0 0; }
    .form-error { color: var(--danger); font-size: .9rem; margin-top: 8px; min-height: 1.2em; }
    .locked-panel {
      border: 1px dashed rgba(163,146,255,0.3); border-radius: 16px;
      padding: 28px 20px; text-align: center; background: rgba(255,255,255,0.02); margin: 8px 0;
    }
    .locked-panel p { max-width: 420px; margin: 0 auto 16px; color: var(--body); }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; margin: 0; }
    th, td {
      text-align: left; padding: 11px 12px; border-bottom: 1px solid rgba(255,255,255,0.06);
      color: var(--body); vertical-align: top;
    }
    th {
      color: var(--soft); font-family: var(--mono); font-size: 11px;
      letter-spacing: .06em; text-transform: uppercase; font-weight: 500;
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    td:first-child { color: var(--text); font-weight: 500; }
    .table-wrap {
      overflow-x: auto; border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; margin: 0 0 18px;
    }
    .job-box { display: grid; gap: 8px; margin: 0 0 18px; }
    .job-box textarea {
      width: 100%; min-height: 72px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(0,0,0,0.28); color: var(--text); padding: 12px 14px;
      font: inherit; font-size: 16px; resize: vertical;
    }
    .job-box textarea:focus { outline: none; border-color: rgba(157,108,255,0.55); }
    .status-row {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      justify-content: space-between; margin: 0 0 16px;
      font-family: var(--mono); font-size: 12px; color: var(--soft);
    }
    .footer {
      margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line);
      font-family: var(--mono); font-size: 11px; color: var(--soft);
      display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    .toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #151b2e; border: 1px solid var(--line-strong); color: var(--text);
      padding: 10px 16px; border-radius: 999px; font-family: var(--mono); font-size: 12px;
      opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .config-banner {
      display: none;
      background: rgba(255, 188, 46, 0.1); border-bottom: 1px solid rgba(255, 188, 46, 0.28);
      color: #f0d48a; font-family: var(--mono); font-size: 11px; padding: 8px 16px;
    }
    .config-banner.show { display: block; }
    .map-line {
      font-family: var(--mono); font-size: 12px; color: var(--soft);
      margin: 0 0 24px; letter-spacing: 0.02em;
    }
    @media (max-width: 700px) {
      .content { padding: 22px 16px 28px; }
      .step-meta, .step-rail { padding-left: 16px; padding-right: 16px; margin-left: 16px; margin-right: 16px; }
      .step-rail { margin-left: 16px; margin-right: 16px; }
      .title .page-name { display: none; }
      h1 { font-size: 1.75rem; }
    }
    @media print {
      body { background: white; color: black; }
      .topbar, .progress-bar, .step-rail, .step-meta, .actions, .nav, .gate-box, .config-banner { display: none !important; }
      .wrap { box-shadow: none; border: none; width: 100%; margin: 0; }
      .check-item, p, td, th, .lede { color: black !important; }
    }
  </style>
</head>

  <script>

    const MASTER_SECTIONS = [

    ];

    const CHECK_TEXT = {};
    PHASES.forEach((p) => (p.checks || []).forEach((c) => { CHECK_TEXT[c.id] = c.text; }));

    // Legacy id redirects (old phase-N links)
    const LEGACY = {
      'phase-0': 'decide', 'phase-1': 'account', 'phase-2': 'access',
      'phase-3': 'data', 'phase-4': 'cost', 'phase-5': 'rules', 'phase-6': 'review',
    };

    function loadState() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
      catch { return {}; }
    }
    function saveState(partial) {
      const next = { ...loadState(), ...partial };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      return next;
    }
    function isUnlocked() { return !!loadState().unlocked; }
    function getChecks() { return loadState().checks || {}; }
    function setCheck(id, value) {
      const checks = { ...getChecks(), [id]: !!value };
      saveState({ checks });
      return checks;
    }

    let currentId = 'intro';

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove('show'), 2200);
    }
    function canAccess(phase) { return phase.free || isUnlocked(); }
    function progressPct() {
      const allIds = Object.keys(CHECK_TEXT);
      if (!allIds.length) return 0;
      const checks = getChecks();
      return Math.round((allIds.filter((id) => checks[id]).length / allIds.length) * 100);
    }
    function stepIndex() {
      return Math.max(0, PHASES.findIndex((p) => p.id === currentId));
    }

    function updateChrome() {
      const unlocked = isUnlocked();
      document.getElementById('access-badge').textContent = unlocked ? 'unlocked' : 'free start';
      document.getElementById('progress-fill').style.width = progressPct() + '%';
      document.getElementById('config-banner').classList.toggle('show', !LEADS_ENDPOINT);
      const phase = PHASES[stepIndex()];
      document.getElementById('step-label').innerHTML = `<strong>${phase.label}</strong>${phase.title && phase.id !== 'intro' && phase.id !== 'gate' ? ' · ' + phase.title : ''}`;
      document.getElementById('step-count').textContent = `${stepIndex() + 1} / ${PHASES.length}`;
      renderRail();
    }

    function renderRail() {
      const rail = document.getElementById('step-rail');
      rail.innerHTML = PHASES.map((p) => {
        const locked = !canAccess(p);
        const checks = getChecks();
        const phaseChecks = (p.checks || []).map((c) => c.id);
        const done = phaseChecks.length && phaseChecks.every((id) => checks[id]);
        const cls = ['step-pill', p.id === currentId ? 'active' : '', done ? 'done' : '', locked ? 'locked' : ''].filter(Boolean).join(' ');
        return `<button type="button" class="${cls}" data-go="${p.id}" ${locked ? 'aria-disabled="true"' : ''}>${p.label}</button>`;
      }).join('');
      rail.querySelectorAll('[data-go]').forEach((btn) => {
        btn.addEventListener('click', () => navigate(btn.getAttribute('data-go')));
      });
    }

    function checklistHtml(items) {
      const checks = getChecks();
      return `<div class="checklist">${items.map((c) => `
        <label class="check-item ${checks[c.id] ? 'checked' : ''}" data-check="${c.id}">
          <input type="checkbox" ${checks[c.id] ? 'checked' : ''} />
          <span>${c.text}</span>
        </label>
      `).join('')}</div>`;
    }

    function bindChecks(root) {
      root.querySelectorAll('[data-check]').forEach((row) => {
        const id = row.getAttribute('data-check');
        const input = row.querySelector('input');
        const sync = () => {
          setCheck(id, input.checked);
          row.classList.toggle('checked', input.checked);
          updateChrome();
          const pct = document.getElementById('master-pct');
          if (pct) pct.textContent = progressPct() + '% complete';
        };
        input.addEventListener('change', sync);
        row.addEventListener('click', (e) => {
          if (e.target === input) return;
          input.checked = !input.checked;
          sync();
        });
      });
    }

    function navButtons(prevId, nextId, nextLabel) {
      const parts = [];
      if (prevId) parts.push(`<button type="button" class="btn ghost" data-go="${prevId}">← Back</button>`);
      if (nextId) parts.push(`<button type="button" class="btn primary" data-go="${nextId}">${nextLabel || 'Continue'} →</button>`);
      return `<div class="actions">${parts.join('')}</div>`;
    }

    function costLadderHtml() {
      return `
        <div class="section-label"><span>Cost ladder</span><span class="subtle">July 2026 — verify before quoting</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Model</th><th>Per 1M (in / out)</th><th>Role</th></tr></thead>
            <tbody>
              <tr><td>Haiku 4.5</td><td>$1 / $5</td><td>Execution. High volume, low stakes.</td></tr>
              <tr><td>Sonnet 5</td><td>$2–3 / $10–15</td><td>Default. Most work lives here.</td></tr>
              <tr><td>Opus 4.8</td><td>$5 / $25</td><td>Hard reasoning. Deliberate.</td></tr>
              <tr><td>Fable 5</td><td>$10 / $50</td><td>Exception only.</td></tr>
            </tbody>
          </table>
        </div>
        <p class="punch">Judgment or execution? Execution → cheap. Judgment → default. Hard + costly failure → escalate.</p>
        <div class="section-label"><span>Task → model</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Task</th><th>Model</th><th>Why</th></tr></thead>
            <tbody>
              <tr><td>Categorize tickets / leads</td><td>Haiku</td><td>Pattern match</td></tr>
              <tr><td>Extract fields</td><td>Haiku</td><td>Structured pull</td></tr>
              <tr><td>Summarize transcript</td><td>Haiku</td><td>Compression</td></tr>
              <tr><td>Client email / proposal</td><td>Sonnet</td><td>Tone + framing</td></tr>
              <tr><td>Code / debug</td><td>Sonnet</td><td>Production reasoning</td></tr>
              <tr><td>Research synthesis</td><td>Sonnet</td><td>Relevance judgment</td></tr>
              <tr><td>Multi-step agent</td><td>Sonnet</td><td>Quality / cost balance</td></tr>
              <tr><td>System architecture</td><td>Opus</td><td>Expensive if wrong</td></tr>
              <tr><td>Long autonomous run</td><td>Fable</td><td>Failed loop costs more</td></tr>
            </tbody>
          </table>
        </div>
      `;
    }

    function lockedTeaser() {
      return `
        <div class="locked-panel">
          <p><span class="highlight">Full playbook is locked.</span><br/>Phases 1–7, cost ladder, master checklist — free unlock.</p>
          <button type="button" class="btn primary" data-go="gate">Unlock →</button>
        </div>
      `;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function renderIntro() {
      return `
        <div class="eyebrow">SMB adoption playbook</div>
        <h1>Installing AI without the mess</h1>
        <p class="punch">AI tools aren’t weak. Adoption is.</p>
        <p class="punch" style="color:var(--green);font-weight:600;">Enthusiasm is an asset. Undisciplined clicking is the liability.</p>
        <ul class="damage">
          <li>Full inbox access nobody remembers granting</li>
          <li>Contracts pasted into tools with murky retention</li>
          <li>Four overlapping subscriptions</li>
          <li>Premium models for routine work</li>
        </ul>
        <p class="map-line">decide → account → access → data → cost → rules → review</p>
        <div class="section-label"><span>Five failure patterns</span><span class="subtle">tap to jump</span></div>
        <div class="card-grid">
          ${FAILURES.map((f) => `
            <button type="button" class="fail-card" data-fail="${f.phase}">
              <strong>${f.title}</strong>
              <p>${f.cost}</p>
            </button>
          `).join('')}
        </div>
        <div class="actions">
          <button type="button" class="btn primary" data-go="decide">Start free — Decide →</button>
          ${isUnlocked()
            ? `<button type="button" class="btn ghost" data-go="account">Continue →</button>`
            : `<button type="button" class="btn ghost" data-go="gate">Unlock full playbook</button>`}
        </div>
      `;
    }

    function renderPhase(phase) {
      if (!canAccess(phase)) {
        return `
          <div class="eyebrow">${phase.eyebrow || ''}</div>
          <h1>${phase.title}</h1>
          ${lockedTeaser()}
        `;
      }

      const state = loadState();
      const jobField = phase.id === 'decide' ? `
        <div class="job-box">
          <label for="job-input">Job to be done (one sentence)</label>
          <textarea id="job-input" placeholder="e.g. Draft first-pass client follow-ups from call notes">${state.job || ''}</textarea>
          <button type="button" class="btn" id="save-job">Save</button>
        </div>
      ` : '';

      const idx = PHASES.findIndex((p) => p.id === phase.id);
      const prev = PHASES[idx - 1];
      let next = PHASES[idx + 1];
      if (phase.id === 'decide' && !isUnlocked()) next = PHASES.find((p) => p.id === 'gate');
      const nextLabel = phase.id === 'decide' && !isUnlocked()
        ? 'Unlock rest'
        : (next && next.id === 'master' ? 'Master list' : 'Next');

      return `
        <div class="eyebrow">${phase.num ? phase.num + ' · ' : ''}${phase.eyebrow || ''}</div>
        <h1>${phase.title}</h1>
        <div class="rule">
          <div class="k">The rule</div>
          <p>${phase.rule || ''}</p>
        </div>
        ${phase.context ? `<p class="context">${phase.context}</p>` : ''}
        ${jobField}
        <div class="section-label"><span>Checklist</span><span class="subtle">saves on this device</span></div>
        ${checklistHtml(phase.checks || [])}
        ${phase.showCostLadder ? costLadderHtml() : ''}
        ${navButtons(prev && prev.id, next && next.id, nextLabel)}
      `;
    }

    function renderGate() {
      if (isUnlocked()) {
        const s = loadState();
        return `
          <div class="eyebrow">unlocked</div>
          <h1>You’re in${s.firstName ? ', ' + escapeHtml(s.firstName) : ''}.</h1>
          <p class="lede">Full playbook open on this device. Progress saves as you check items off.</p>
          <div class="actions">
            <button type="button" class="btn primary" data-go="account">Continue to Account →</button>
            <button type="button" class="btn ghost" data-go="master">Master list</button>
          </div>
        `;
      }
      return `
        <div class="eyebrow">free access</div>
        <h1>Unlock the full playbook</h1>
        <p class="lede">Chapters 2–7 · cost ladder · master checklist</p>
        <div class="gate-box">
          <form class="form-grid" id="lead-form" novalidate>
            <label>First name
              <input type="text" name="firstName" autocomplete="given-name" required placeholder="Nick" />
            </label>
            <label>Email
              <input type="email" name="email" autocomplete="email" required placeholder="you@company.com" />
            </label>
            <div class="hp" aria-hidden="true">
              <label>Company website <input type="text" name="website" tabindex="-1" autocomplete="off" /></label>
            </div>
            <button type="submit" class="btn primary" id="lead-submit">Unlock →</button>
            <p class="form-note">No spam.</p>
            <div class="form-error" id="lead-error"></div>
          </form>
        </div>
        <div class="actions">
          <button type="button" class="btn ghost" data-go="decide">← Back</button>
        </div>
      `;
    }

    function renderMaster() {
      if (!isUnlocked()) {
        return `<div class="eyebrow">master checklist</div><h1>Master checklist</h1>${lockedTeaser()}`;
      }
      const sections = MASTER_SECTIONS.map((sec) => {
        const items = sec.ids.map((id) => ({ id, text: CHECK_TEXT[id] }));
        return `<div class="section-label"><span>${sec.title}</span></div>${checklistHtml(items)}`;
      }).join('');
      return `
        <div class="eyebrow">one list</div>
        <h1>Master checklist</h1>
        <p class="lede">Top to bottom on setup. Keep review running.</p>
        <div class="status-row">
          <span id="master-pct">${progressPct()}% complete</span>
          <span>
            <button type="button" class="btn" id="print-btn">Print</button>
            <button type="button" class="btn ghost" id="reset-checks">Reset</button>
          </span>
        </div>
        ${sections}
        ${navButtons('review', 'done', 'Finish')}
      `;
    }

    function renderDone() {
      if (!isUnlocked()) return lockedTeaser();
      const s = loadState();
      return `
        <div class="eyebrow">movement is mandatory</div>
        <h1>You’re set to adopt without the mess</h1>
        <p class="lede">${s.firstName ? escapeHtml(s.firstName) + ' — ' : ''}${progressPct()}% of the checklist done on this device. Keep the monthly review on the calendar for Q1.</p>
        <div class="card-grid">
          <a class="info-card" href="../ai-maturity.html" style="text-decoration:none;">
            <strong>AI Maturity</strong>
            <p>Where is the org on L0–L4?</p>
          </a>
          <a class="info-card" href="../open-tools/" style="text-decoration:none;">
            <strong>Open Tools</strong>
            <p>Prompts once the rules exist.</p>
          </a>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" data-go="master">Back to checklist</button>
          <button type="button" class="btn ghost" data-go="intro">Start</button>
        </div>
      `;
    }

    function render() {
      const phase = PHASES.find((p) => p.id === currentId) || PHASES[0];
      const view = document.getElementById('view');
      if (phase.id === 'intro') view.innerHTML = renderIntro();
      else if (phase.id === 'gate') view.innerHTML = renderGate();
      else if (phase.id === 'master') view.innerHTML = renderMaster();
      else if (phase.id === 'done') view.innerHTML = renderDone();
      else view.innerHTML = renderPhase(phase);

      updateChrome();
      bindChecks(view);

      view.querySelectorAll('[data-go]').forEach((el) => {
        el.addEventListener('click', () => navigate(el.getAttribute('data-go')));
      });
      view.querySelectorAll('[data-fail]').forEach((el) => {
        el.addEventListener('click', () => navigate(el.getAttribute('data-fail')));
      });

      const jobSave = view.querySelector('#save-job');
      if (jobSave) {
        jobSave.addEventListener('click', () => {
          const val = (view.querySelector('#job-input').value || '').trim();
          saveState({ job: val });
          toast(val ? 'Saved' : 'Cleared');
        });
      }

      const form = view.querySelector('#lead-form');
      if (form) form.addEventListener('submit', onLeadSubmit);

      const printBtn = view.querySelector('#print-btn');
      if (printBtn) printBtn.addEventListener('click', () => window.print());

      const resetBtn = view.querySelector('#reset-checks');
      if (resetBtn) {
        resetBtn.addEventListener('click', () => {
          if (!confirm('Clear checklist progress on this device?')) return;
          saveState({ checks: {} });
          toast('Reset');
          render();
        });
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigate(id) {
      id = LEGACY[id] || id;
      // Deep link #cost etc.
      if (id.startsWith('#')) id = id.slice(1);
      const phase = PHASES.find((p) => p.id === id);
      if (!phase) return;
      if (!canAccess(phase)) {
        currentId = 'gate';
        render();
        toast('Unlock to open that chapter');
        return;
      }
      currentId = id;
      saveState({ lastStep: id });
      if (location.hash !== '#' + id && id !== 'intro') {
        history.replaceState(null, '', '#' + id);
      }
      render();
    }

    async function onLeadSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const err = document.getElementById('lead-error');
      const submit = document.getElementById('lead-submit');
      err.textContent = '';

      const firstName = (form.firstName.value || '').trim();
      const email = (form.email.value || '').trim();
      const website = (form.website.value || '').trim();

      if (website) { unlockLocal(firstName, email); return; }
      if (!firstName) { err.textContent = 'First name required.'; return; }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        err.textContent = 'Enter a valid email.';
        return;
      }

      submit.disabled = true;
      submit.textContent = 'Unlocking…';

      try {
        if (!LEADS_ENDPOINT) {
          unlockLocal(firstName, email);
          toast('Unlocked (leads not connected yet)');
          return;
        }
        const res = await fetch(LEADS_ENDPOINT, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            firstName, email, source: 'ai-adoption',
            page: location.href, ts: new Date().toISOString(),
          }),
        });
        if (!res.ok) throw new Error('fail');
        unlockLocal(firstName, email);
      } catch {
        err.textContent = 'Could not unlock. Check connection and try again.';
        submit.disabled = false;
        submit.textContent = 'Unlock →';
      }
    }

    function unlockLocal(firstName, email) {
      saveState({
        unlocked: true, firstName, email,
        unlockedAt: new Date().toISOString(),
      });
      toast('Playbook unlocked');
      currentId = 'account';
      render();
    }

    (function boot() {
      const hash = (location.hash || '').replace(/^#/, '');
      const s = loadState();
      let start = hash || s.lastStep || 'intro';
      start = LEGACY[start] || start;
      if (PHASES.some((p) => p.id === start && canAccess(p))) currentId = start;
      else if (PHASES.some((p) => p.id === start) && !canAccess(PHASES.find((p) => p.id === start))) currentId = 'gate';
      render();
    })();
  </script>
</body>
</html>
