<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nick Scarabosio</title>
  <meta name="description" content="AI ops for midsize companies — without the mess. Adoption guide, maturity model, open tools." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #070912;
      --line: rgba(163, 146, 255, 0.16);
      --line-strong: rgba(163, 146, 255, 0.35);
      --text: #f2f3ff;
      --body: #d8dcf0;
      --muted: #9ea6c5;
      --soft: #6d7591;
      --purple-solid: #8b5cf6;
      --shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Inter', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at 50% 0%, rgba(157, 108, 255, 0.22), transparent 34%),
        radial-gradient(circle at 85% 18%, rgba(126, 240, 180, 0.06), transparent 24%),
        var(--bg);
      color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased;
      display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    }
    .wrap {
      width: min(640px, 100%);
      border: 1px solid rgba(255,255,255,0.07); border-radius: 24px; overflow: hidden;
      background: linear-gradient(180deg, rgba(17, 23, 39, 0.98), rgba(10, 13, 24, 0.98));
      box-shadow: var(--shadow);
    }
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 14px 18px;
      border-bottom: 1px solid var(--line); background: rgba(255,255,255,0.02);
    }
    .lights { display: flex; gap: 7px; }
    .lights i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .lights i:nth-child(1) { background: #ff5f57; }
    .lights i:nth-child(2) { background: #febc2e; }
    .lights i:nth-child(3) { background: #28c840; }
    .title { margin: 0 auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
    .content { padding: 48px 36px 40px; text-align: center; }
    h1 {
      margin: 0 0 14px; font-size: clamp(2.4rem, 7vw, 3.4rem);
      line-height: .98; letter-spacing: -0.04em;
    }
    .subtitle {
      margin: 0 0 8px; color: var(--body); font-size: 1.12rem; line-height: 1.5;
      max-width: 380px; margin-left: auto; margin-right: auto; font-weight: 500;
    }
    .pathway {
      margin: 0 0 32px; color: var(--soft); font-family: var(--mono);
      font-size: 12px; letter-spacing: 0.04em;
    }
    .actions { display: flex; flex-direction: column; gap: 10px; max-width: 320px; margin: 0 auto; }
    .btn {
      appearance: none; border: 1px solid var(--line); background: transparent; color: var(--text);
      border-radius: 12px; padding: 14px 22px; font: inherit; font-size: 15px; font-weight: 500;
      cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center;
      gap: 8px; transition: all 0.15s ease; min-height: 48px;
    }
    .btn:hover { border-color: var(--line-strong); background: rgba(157,108,255,0.1); }
    .primary {
      border-color: transparent; background: var(--purple-solid); color: #fff; font-weight: 600;
    }
    .primary:hover { filter: brightness(1.08); background: #9b6dff; }
    .btn small {
      display: block; font-weight: 400; font-size: 12px; color: rgba(255,255,255,0.75);
      margin-top: 2px;
    }
    .primary span { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
    .secondary small { color: var(--soft); font-size: 12px; font-weight: 400; }
    .footer {
      margin-top: 36px; font-family: var(--mono); font-size: 11px; color: var(--soft);
    }
    @media (max-width: 600px) {
      .content { padding: 36px 22px 32px; }
      h1 { font-size: 2.2rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="title">nickscarabosio</div>
    </div>

    <div class="content">
      <h1>Nick Scarabosio</h1>
      <p class="subtitle">AI ops for midsize companies — without the mess.</p>
      <p class="pathway">Guide · Maturity · Tools</p>

      <div class="actions">
        <a href="ai-adoption/" class="btn primary">
          <span>Install AI safely<small>Adoption guide</small></span>
        </a>
        <a href="ai-maturity.html" class="btn secondary">
          <span>See where you stand<small style="display:block;color:var(--soft);font-size:12px;font-weight:400;margin-top:2px;">Maturity model</small></span>
        </a>
        <a href="open-tools/" class="btn secondary">
          <span>Steal the tools<small style="display:block;color:var(--soft);font-size:12px;font-weight:400;margin-top:2px;">Prompts &amp; systems</small></span>
        </a>
      </div>

      <div class="footer">Culture to Cash · prompts &amp; systems</div>
    </div>
  </div>
</body>
</html>
